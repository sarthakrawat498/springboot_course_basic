spring.application.name=myapp
server.port=8081
# use wildcard "*" to expose all endpoints
# can also specify individual endpoints to expose, e.g. "health,info" with comma separating them
management.endpoints.web.exposure.include = *
management.info.env.enabled = true

#Exclude individual properties from being exposed in the /actuator/info endpoint
management.endpoints.web.exposure.exclude = health,info


info.app.name = My Application
info.app.description = An application
info.app.version = 1.0.0

