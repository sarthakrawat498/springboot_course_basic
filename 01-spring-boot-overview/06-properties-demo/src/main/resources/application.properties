spring.application.name=myapp
server.port=8081
#changing the context path of application so all requests prefixed with /myapp
server.servlet.context-path = /myapp
# use wildcard "*" to expose all endpoints
# can also specify individual endpoints to expose, e.g. "health,info" with comma separating them
management.endpoints.web.exposure.include = *
management.info.env.enabled = true

info.app.name = My Application
info.app.description = An application
info.app.version = 1.0.0

#Define custom properties
coach.name = Mickey mouse
team.name = The Mouse Club