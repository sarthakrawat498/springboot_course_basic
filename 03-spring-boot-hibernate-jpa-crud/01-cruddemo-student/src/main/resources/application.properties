spring.application.name=cruddemo
server.port = 8081

spring.datasource.url=jdbc:postgresql://localhost:5432/student_tracker
spring.datasource.username = springstudent
spring.datasource.password = springstudent

#turn off sprinboot banner
spring.main.banner-mode=off

#Reduce logging level. Set logging level to warn
logging.level.root=warn

#Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

#configure JPA/Hibernate to auto create the tables
#the update config will keep existing data in the tables and only add new tables or columns as needed.
# The create config will drop existing tables and create new ones, which will result in data loss.
spring.jpa.hibernate.ddl-auto=update